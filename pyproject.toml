[project]
name = "mirai-path"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "pypdf>=5.4.0",
]

[tool.vercel]
entrypoint = "backend.main:app"